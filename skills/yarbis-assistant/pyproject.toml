[project]
name = "yarbis-assistant"
version = "0.1.0"
description = "Yarbis - AI assistant for Club Juntos with personality"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Club Juntos Dev Team" }
]

dependencies = [
    "fastmcp>=0.1.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.9.0",
    "anthropic>=0.25.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.uv]
python = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
